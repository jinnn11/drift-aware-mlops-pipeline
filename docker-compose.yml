x-common-env: &common-env
  APP_ENV: dev
  TZ: UTC
  DATASET_PATH: /app/data/raw/bank-additional-full.csv
  REFERENCE_DATA_PATH: /app/data/processed/reference.csv
  MODEL_PATH: /app/models/model.pkl
  MODEL_METADATA_PATH: /app/models/model_metadata.json
  LOG_DIR: /app/logs
  REPORT_DIR: /app/reports
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: bank_marketing_xgboost
  DATABASE_URL: postgresql+psycopg2://mlops:mlops@postgres:5432/mlops
  DRIFT_THRESHOLD: "0.30"
  RETRAIN_IMPROVEMENT_THRESHOLD: "0.005"
  DEGRADATION_THRESHOLD: "0.03"

services:
  postgres:
    image: postgres:15
    container_name: ml_postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres-init.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: mlflow
    environment:
      <<: *common-env
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlops:mlops@postgres:5432/mlflow
      --default-artifact-root /app/mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5001:5000"
    volumes:
      - ./:/app
      - mlflow_artifacts:/app/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ml_api
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ml_trainer
    environment:
      <<: *common-env
    command: ["sleep", "infinity"]
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  airflow-init:
    image: apache/airflow:2.10.2-python3.11
    container_name: airflow_init
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: >
        xgboost==2.1.1 scikit-learn==1.5.2 mlflow==2.17.0 evidently==0.4.38
        psycopg2-binary==2.9.9 sqlalchemy<2 pandas<2.2 protobuf<5 cryptography<44
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.2-python3.11
    container_name: airflow_webserver
    restart: always
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: >
        xgboost==2.1.1 scikit-learn==1.5.2 mlflow==2.17.0 evidently==0.4.38
        psycopg2-binary==2.9.9 sqlalchemy<2 pandas<2.2 protobuf<5 cryptography<44
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:2.10.2-python3.11
    container_name: airflow_scheduler
    restart: always
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: >
        xgboost==2.1.1 scikit-learn==1.5.2 mlflow==2.17.0 evidently==0.4.38
        psycopg2-binary==2.9.9 sqlalchemy<2 pandas<2.2 protobuf<5 cryptography<44
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_artifacts:
  grafana_data:
  prometheus_data:
