apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: your-registry/ml-system-worker:latest
          command:
            - mlflow
            - server
            - --backend-store-uri
            - postgresql+psycopg2://mlops:mlops@postgres:5432/mlops
            - --default-artifact-root
            - /app/mlruns
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /app/mlruns
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-system
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
