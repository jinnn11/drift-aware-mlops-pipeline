apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: ml-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: airflow-webserver
          image: apache/airflow:2.10.2-python3.11
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: ml-system-secrets
                  key: DATABASE_URL
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: ml-system
spec:
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
