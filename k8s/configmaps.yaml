apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-system-env
  namespace: ml-system
data:
  APP_ENV: dev
  TZ: UTC
  DATASET_PATH: /app/data/raw/bank-additional-full.csv
  REFERENCE_DATA_PATH: /app/data/processed/reference.csv
  MODEL_PATH: /app/models/model.pkl
  MODEL_METADATA_PATH: /app/models/model_metadata.json
  LOG_DIR: /app/logs
  REPORT_DIR: /app/reports
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: bank_marketing_xgboost
  DRIFT_THRESHOLD: "0.30"
  RETRAIN_IMPROVEMENT_THRESHOLD: "0.005"
  DEGRADATION_THRESHOLD: "0.03"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ml-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: ml_api
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8000"]
